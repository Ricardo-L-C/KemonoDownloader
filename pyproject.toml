[project]
name = "kemonoDownloader"
version = "1.0.0"
description = "A cross-platform Python app built with PyQt6 to download posts and creator content from Kemono.cr."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.12.15",
    "asyncio>=4.0.0",
    "briefcase>=0.3.25",
    "bs4>=0.0.2",
    "fake-useragent>=2.2.0",
    "packaging>=25.0",
    "pillow>=11.3.0",
    "pyinstaller>=6.16.0",
    "pyqt6>=6.9.1",
    "qtawesome>=1.4.0",
    "requests>=2.32.5",
]

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
